<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="th dh">
<title id="th">SMSO Lab mark</title>
<desc id="dh">A gold hub connected by four teal spokes to four outer nodes on a navy circular badge — one spoke per letter of Smart, Mobility, Systems, Operations.</desc>
<style>
  .h-bg{ fill:#10243E; } .h-ring{ fill:none; stroke:#1B6F6F; stroke-width:2; opacity:.5; }
  .h-spoke{ stroke:#3FC7C1; stroke-width:5; stroke-linecap:round; transition:stroke-width .25s ease; }
  svg:hover .h-spoke{ stroke-width:6; }
  .h-node{ fill:#3FC7C1; stroke:#10243E; stroke-width:2; transform-origin:center; transform-box:fill-box; transition:transform .3s ease; }
  svg:hover .h-node{ transform:scale(1.25); }
  .h-hub{ fill:#C9A227; stroke:#FFFFFF; stroke-width:2.5; transform-origin:center; transform-box:fill-box; transition:transform .4s ease; }
  svg:hover .h-hub{ transform:rotate(20deg); }
</style>
<circle class="h-bg" cx="60" cy="60" r="58"/>
<circle class="h-ring" cx="60" cy="60" r="50"/>
<line class="h-spoke" x1="60" y1="60" x2="60" y2="26"/>
<line class="h-spoke" x1="60" y1="60" x2="94" y2="60"/>
<line class="h-spoke" x1="60" y1="60" x2="60" y2="94"/>
<line class="h-spoke" x1="60" y1="60" x2="26" y2="60"/>
<circle class="h-node" cx="60" cy="26" r="7"/>
<circle class="h-node" cx="94" cy="60" r="7"/>
<circle class="h-node" cx="60" cy="94" r="7"/>
<circle class="h-node" cx="26" cy="60" r="7"/>
<circle class="h-hub" cx="60" cy="60" r="13"/>
</svg>
